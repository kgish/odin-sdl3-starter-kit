name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-15
          - name: windows-amd64
            os: windows-2025

    steps:
      - uses: actions/checkout@v4

      - name: Cache locked dependencies
        uses: actions/cache@v4
        with:
          path: |
            third_party/prefix
            third_party/odin
          key: deps-${{ matrix.name }}-${{ matrix.os }}-${{ hashFiles('deps.lock.json') }}

      # --- Linux ------------------------------------------------------------

      - name: Install SDL build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build pkg-config python3 \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev

      # --- macOS ------------------------------------------------------------

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # --- Unix -------------------------------------------------------------

      - name: Bootstrap (Unix)
        if: runner.os != 'Windows'
        run: scripts/bootstrap.sh --with-odin --all-features

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          scripts/build.sh debug
          scripts/build.sh release

      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: scripts/test.sh --require-features

      - name: Package and launch check (Unix)
        if: runner.os != 'Windows'
        run: scripts/package.sh

      # --- Windows ----------------------------------------------------------

      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: Bootstrap (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/bootstrap.ps1 -AllFeatures

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          scripts/build.ps1 debug
          scripts/build.ps1 release

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/test.ps1 -RequireFeatures

      - name: Package and launch check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/package.ps1

      # --- Results ----------------------------------------------------------

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ matrix.name }}
          path: build/integration-logs
          if-no-files-found: ignore

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: starter-${{ matrix.name }}
          path: dist/${{ matrix.name }}
